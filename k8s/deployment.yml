apiVersion: apps/v1
kind: Deployment

metadata:
  name: cicd-demo
  namespace: cicd-demo

spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo

    spec:
      containers:
        - name: cicd-demo
          image: ghcr.io/ajitgoud/cicd-demo:47c859a7e8a0c599823f45389440da79b9fd7974
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080